name: Apply stable encounter tier fix

"on":
  push:
    paths:
      - ".github/workflows/apply-stable-encounter-tiers.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch stable encounter tiers
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/wild_encounter.c')
          text = p.read_text()

          old = '''static u32 GetScaledWildTier(enum WildPokemonArea area, u8 wildMonIndex)
{
    u32 badgeCount = 0;
    u32 tier;

    for (u32 flag = FLAG_BADGE01_GET; flag < FLAG_BADGE01_GET + NUM_BADGES; flag++)
    {
        if (FlagGet(flag))
            badgeCount++;
    }

    if (badgeCount == 0)
        tier = 0;
    else if (badgeCount <= 2)
        tier = 1;
    else if (badgeCount <= 4)
        tier = 2;
    else if (badgeCount <= 6)
        tier = 3;
    else
        tier = 4;

    // Rod progression already gates these encounters. Preserve the reward for
    // acquiring better rods even when their tables are viewed on an early map.
    if (area == WILD_AREA_FISHING && wildMonIndex >= 5)
        tier = 4; // Super Rod
    else if (area == WILD_AREA_FISHING && wildMonIndex >= 2 && tier < 2)
        tier = 2; // Good Rod

    return tier;
}
'''

          new = '''static u32 GetScaledWildTier(const struct WildPokemonInfo *wildMonInfo, enum WildPokemonArea area, u8 wildMonIndex, u8 seedMonIndex)
{
    // Encounter scaling must be stable for the life of a run. Derive the tier
    // from the area's native encounter level rather than the player's current
    // badge count, so revisiting an early route never rerolls it into a later
    // progression pool.
    u32 nativeLevel = wildMonInfo->wildPokemon[seedMonIndex].maxLevel;
    u32 tier;

    if (nativeLevel <= 10)
        tier = 0;
    else if (nativeLevel <= 20)
        tier = 1;
    else if (nativeLevel <= 30)
        tier = 2;
    else if (nativeLevel <= 40)
        tier = 3;
    else
        tier = 4;

    // Rod progression already gates these encounters. Preserve the reward for
    // acquiring better rods even when their tables are on an early map.
    if (area == WILD_AREA_FISHING && wildMonIndex >= 5)
        tier = 4; // Super Rod
    else if (area == WILD_AREA_FISHING && wildMonIndex >= 2 && tier < 2)
        tier = 2; // Good Rod

    return tier;
}
'''

          if old not in text:
              raise SystemExit('GetScaledWildTier block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'filterArgs.arg2 = GetScaledWildTier(area, wildMonIndex);',
              'filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);',
              1,
          )
          text = text.replace(
              'filterArgs.arg1 = GetScaledWildTier(area, wildMonIndex);',
              'filterArgs.arg1 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);',
              1,
          )

          p.write_text(text)
          Path('.github/workflows/apply-stable-encounter-tiers.yml').unlink()

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wild_encounter.c .github/workflows/apply-stable-encounter-tiers.yml
          git commit -m "Keep scaled encounters stable across progression"
          git push origin HEAD:master
