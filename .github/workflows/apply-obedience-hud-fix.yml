name: Apply Important Battle Obedience + Battle HUD Fix

"on":
  push:
    paths:
      - ".github/workflows/apply-obedience-hud-fix.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply obedience and HUD fixes
        run: python3 .github/scripts/apply_obedience_hud_fix.py
      - name: Commit implemented source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/debug.c src/battle_util.c src/battle_controller_player.c src/battle_interface.c
          git commit -m "Important Battle Obedience + Battle HUD Fix"
          git push origin master
