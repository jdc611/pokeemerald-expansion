name: Apply Runtime Cleanup

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-runtime-cleanup.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply runtime cleanup
        run: python3 .github/scripts/apply_runtime_cleanup.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/caps.c src/start_menu.c src/debug.c
          git diff --cached --quiet && exit 0
          git commit -m "Fix runtime cap and menu cleanup issues"
          git push origin master
