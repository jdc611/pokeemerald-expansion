name: Apply DexNav encounter cache optimization

"on":
  push:
    paths:
      - ".github/workflows/apply-dexnav-encounter-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add deterministic encounter cache
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/wild_encounter.c')
          text = p.read_text()

          anchor = '''EWRAM_DATA u8 gChainFishingDexNavStreak = 0;\n'''
          insert = '''EWRAM_DATA u8 gChainFishingDexNavStreak = 0;\n\n#define RANDOMIZED_WILD_CACHE_SIZE 32\n\nstruct RandomizedWildCacheEntry\n{\n    u32 seed;\n    u32 generator;\n    u32 arg1;\n    u32 arg2;\n    enum Species species;\n    bool8 valid;\n};\n\nEWRAM_DATA static struct RandomizedWildCacheEntry sRandomizedWildCache[RANDOMIZED_WILD_CACHE_SIZE] = {0};\n'''
          if anchor not in text:
              raise SystemExit('cache insertion anchor not found')
          text = text.replace(anchor, insert, 1)

          old = '''    SeedRng(seed);\n    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n    {\n        filterArgs.arg1 = gSaveBlock3Ptr->filterValue;\n        if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n        {\n            filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n            generator = SPECIES_GENERATOR_SCALED_TYPE_FILTERED;\n        }\n        else\n        {\n            generator = SPECIES_GENERATOR_TYPE_FILTERED;\n        }\n    }\n    else if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n    {\n        filterArgs.arg1 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n        generator = SPECIES_GENERATOR_SCALED_WILD;\n    }\n    species = GetRandomSpecies(generator, &filterArgs);\n\n    gRngValue = oldRngState;\n\n    return species;\n'''

          new = '''    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n    {\n        filterArgs.arg1 = gSaveBlock3Ptr->filterValue;\n        if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n        {\n            filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n            generator = SPECIES_GENERATOR_SCALED_TYPE_FILTERED;\n        }\n        else\n        {\n            generator = SPECIES_GENERATOR_TYPE_FILTERED;\n        }\n    }\n    else if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n    {\n        filterArgs.arg1 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n        generator = SPECIES_GENERATOR_SCALED_WILD;\n    }\n\n    // DexNav and encounter-level lookups repeatedly ask for the same seeded\n    // species slots. Cache the deterministic result so those UI scans do not\n    // rerun the full filtered species search dozens of times.\n    {\n        u32 cacheIndex = (seed ^ (generator * 33u) ^ filterArgs.arg1 ^ (filterArgs.arg2 << 8)) & (RANDOMIZED_WILD_CACHE_SIZE - 1);\n        struct RandomizedWildCacheEntry *cache = &sRandomizedWildCache[cacheIndex];\n\n        if (cache->valid\n         && cache->seed == seed\n         && cache->generator == generator\n         && cache->arg1 == filterArgs.arg1\n         && cache->arg2 == filterArgs.arg2)\n            return cache->species;\n\n        SeedRng(seed);\n        species = GetRandomSpecies(generator, &filterArgs);\n\n        cache->seed = seed;\n        cache->generator = generator;\n        cache->arg1 = filterArgs.arg1;\n        cache->arg2 = filterArgs.arg2;\n        cache->species = species;\n        cache->valid = TRUE;\n    }\n\n    gRngValue = oldRngState;\n\n    return species;\n'''

          if old not in text:
              raise SystemExit('GetRandomizedWildSpecies generation block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          Path('.github/workflows/apply-dexnav-encounter-cache.yml').unlink()

      - name: Commit optimized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wild_encounter.c .github/workflows/apply-dexnav-encounter-cache.yml
          git commit -m "Cache randomized wild species for faster DexNav loading"
          git push origin HEAD:master
