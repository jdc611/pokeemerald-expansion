name: Apply Traced Obedience + Battle UI Fix

"on":
  push:
    paths:
      - ".github/workflows/apply-real-obedience-ui-fix.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply traced fixes
        run: python3 .github/scripts/apply_real_obedience_ui_fix.py
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/battle_util.c src/debug.c src/battle_controller_player.c src/battle_interface.c
          git commit -m "Traced Important Battle Obedience + Battle UI Fix"
          git push origin master
