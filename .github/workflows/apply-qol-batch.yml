name: Apply QoL Batch

on:
  push:
    paths:
      - '.github/scripts/apply_qol_batch.py'
      - '.github/workflows/apply-qol-batch.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply QoL batch
        run: python3 .github/scripts/apply_qol_batch.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/global.h include/caps.h src/caps.c src/party_menu.c src/start_menu.c src/region_map.c
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add PokéRider, cap tools, MGM, and infinite Rare Candy'
          git push
