name: Apply ability and combined run filters

on:
  push:
    paths:
      - ".github/workflows/apply-ability-filter.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch ability filters
        shell: python
        run: |
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # SaveBlock3 needs >255 ability ids. Keep one compact u16 filter payload.
          must_replace('include/global.h', '    u8 filterValue;\n', '    u16 filterValue;\n')

          # Locate run-filter enum/constants and extend it.
          filter_file = None
          for p in Path('include').rglob('*.h'):
              text = p.read_text(errors='ignore')
              if 'RUN_FILTER_NONE' in text and 'RUN_FILTER_TYPE' in text:
                  filter_file = p
                  if 'RUN_FILTER_ABILITY' not in text:
                      if 'RUN_FILTER_NONE,\n    RUN_FILTER_TYPE,' in text:
                          text = text.replace('RUN_FILTER_NONE,\n    RUN_FILTER_TYPE,', 'RUN_FILTER_NONE,\n    RUN_FILTER_TYPE,\n    RUN_FILTER_ABILITY,\n    RUN_FILTER_TYPE_ABILITY,', 1)
                      elif '#define RUN_FILTER_NONE 0' in text and '#define RUN_FILTER_TYPE 1' in text:
                          text = text.replace('#define RUN_FILTER_TYPE 1', '#define RUN_FILTER_TYPE 1\n#define RUN_FILTER_ABILITY 2\n#define RUN_FILTER_TYPE_ABILITY 3', 1)
                      else:
                          raise SystemExit(f'Could not extend run filter constants in {p}')
                      p.write_text(text)
                  break
          if filter_file is None:
              raise SystemExit('RUN_FILTER constants not found')

          # Generator enum.
          p = Path('include/constants/random_mon_generation.h')
          text = p.read_text()
          if 'SPECIES_GENERATOR_ABILITY_FILTERED' not in text:
              text = text.replace(
                  '    SPECIES_GENERATOR_SCALED_TYPE_FILTERED,\n',
                  '    SPECIES_GENERATOR_SCALED_TYPE_FILTERED,\n'
                  '    SPECIES_GENERATOR_ABILITY_FILTERED,\n'
                  '    SPECIES_GENERATOR_SCALED_ABILITY_FILTERED,\n'
                  '    SPECIES_GENERATOR_TYPE_ABILITY_FILTERED,\n'
                  '    SPECIES_GENERATOR_SCALED_TYPE_ABILITY_FILTERED,\n', 1)
          p.write_text(text)

          # Generator function declarations + implementations.
          p = Path('src/random_mon_generation.c')
          text = p.read_text()
          if 'IsAbilityFilteredWildSpeciesFilterFunc' not in text:
              text = text.replace(
                  'static bool32 IsTypeFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs);\n',
                  'static bool32 IsTypeFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs);\n'
                  'static bool32 IsAbilityFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs);\n'
                  'static bool32 IsTypeAbilityFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs);\n', 1)
              anchor = '''static enum Species GetRandomSpeciesAtIndex(const struct RandomSpeciesGeneratorOptions *options, u32 index)\n'''
              funcs = '''static bool32 IsAbilityFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs)\n{\n    struct FilterFuncArgs scaledArgs;\n    enum Ability ability = filterFuncArgs->arg1;\n\n    if (GetSpeciesAbility(species, 0) != ability\n     && GetSpeciesAbility(species, 1) != ability\n     && GetSpeciesAbility(species, 2) != ability)\n        return FALSE;\n\n    if (filterFuncArgs->arg2 == FILTER_FUNC_ARG_NONE)\n        return TRUE;\n\n    scaledArgs.arg1 = filterFuncArgs->arg2;\n    scaledArgs.arg2 = FILTER_FUNC_ARG_NONE;\n    return IsScaledWildSpeciesFilterFunc(species, &scaledArgs);\n}\n\nstatic bool32 IsTypeAbilityFilteredWildSpeciesFilterFunc(enum Species species, const struct FilterFuncArgs *filterFuncArgs)\n{\n    struct FilterFuncArgs scaledArgs;\n    u32 packed = filterFuncArgs->arg1;\n    enum Type type = packed & 31;\n    enum Ability ability = packed >> 5;\n\n    if (GetSpeciesType(species, 0) != type && GetSpeciesType(species, 1) != type)\n        return FALSE;\n    if (GetSpeciesAbility(species, 0) != ability\n     && GetSpeciesAbility(species, 1) != ability\n     && GetSpeciesAbility(species, 2) != ability)\n        return FALSE;\n\n    if (filterFuncArgs->arg2 == FILTER_FUNC_ARG_NONE)\n        return TRUE;\n\n    scaledArgs.arg1 = filterFuncArgs->arg2;\n    scaledArgs.arg2 = FILTER_FUNC_ARG_NONE;\n    return IsScaledWildSpeciesFilterFunc(species, &scaledArgs);\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('random generator insertion anchor missing')
              text = text.replace(anchor, funcs + anchor, 1)
          p.write_text(text)

          # Add generator option table entries.
          p = Path('src/data/random_mon_generator.h')
          text = p.read_text()
          if 'SPECIES_GENERATOR_ABILITY_FILTERED' not in text:
              marker = '\n};\n\nstatic const struct RandomItemGeneratorOptions'
              entries = '''\n    [SPECIES_GENERATOR_ABILITY_FILTERED] =\n    {\n        .filterFunc = IsAbilityFilteredWildSpeciesFilterFunc,\n        .banLegendary = TRUE, .banMythical = TRUE, .banSubLegendary = TRUE,\n        .banUltraBeast = TRUE, .banParadox = TRUE, .randomizeForms = FALSE,\n        .dexMode = RANDOM_MON_DEX_NATIONAL,\n    },\n    [SPECIES_GENERATOR_SCALED_ABILITY_FILTERED] =\n    {\n        .filterFunc = IsAbilityFilteredWildSpeciesFilterFunc,\n        .banLegendary = TRUE, .banMythical = TRUE, .banSubLegendary = TRUE,\n        .banUltraBeast = TRUE, .banParadox = TRUE, .randomizeForms = FALSE,\n        .dexMode = RANDOM_MON_DEX_NATIONAL,\n    },\n    [SPECIES_GENERATOR_TYPE_ABILITY_FILTERED] =\n    {\n        .filterFunc = IsTypeAbilityFilteredWildSpeciesFilterFunc,\n        .banLegendary = TRUE, .banMythical = TRUE, .banSubLegendary = TRUE,\n        .banUltraBeast = TRUE, .banParadox = TRUE, .randomizeForms = FALSE,\n        .dexMode = RANDOM_MON_DEX_NATIONAL,\n    },\n    [SPECIES_GENERATOR_SCALED_TYPE_ABILITY_FILTERED] =\n    {\n        .filterFunc = IsTypeAbilityFilteredWildSpeciesFilterFunc,\n        .banLegendary = TRUE, .banMythical = TRUE, .banSubLegendary = TRUE,\n        .banUltraBeast = TRUE, .banParadox = TRUE, .randomizeForms = FALSE,\n        .dexMode = RANDOM_MON_DEX_NATIONAL,\n    },\n'''
              if marker not in text:
                  raise SystemExit('generator options table marker missing')
              text = text.replace(marker, entries + marker, 1)
          p.write_text(text)

          # Main menu storage/UI.
          p = Path('src/main_menu.c')
          text = p.read_text()
          text = text.replace('EWRAM_DATA u8 gRunSetupFilterValue;\n', 'EWRAM_DATA u16 gRunSetupFilterValue;\n')
          if 'sRunSetupAbility' not in text:
              text = text.replace('static EWRAM_DATA u8 sRunSetupType;\n', 'static EWRAM_DATA u8 sRunSetupType;\nstatic EWRAM_DATA u16 sRunSetupAbility;\n', 1)
          if 'sText_RunSetupAbility' not in text:
              text = text.replace('static const u8 sText_RunSetupType[] = _("TYPE");\n', 'static const u8 sText_RunSetupType[] = _("TYPE");\nstatic const u8 sText_RunSetupAbility[] = _("ABILITY");\nstatic const u8 sText_RunSetupBoth[] = _("BOTH");\nstatic const u8 sText_RunSetupLimitedPool[] = _("WARNING: VERY LIMITED POOL");\n', 1)
          text = text.replace('        sRunSetupType = TYPE_NORMAL;\n', '        sRunSetupType = TYPE_NORMAL;\n        sRunSetupAbility = ABILITY_INTIMIDATE;\n', 1)

          # Helper for warning/zero-pool validation.
          if 'RunSetup_CountEligibleFilterMons' not in text:
              anchor = 'static void RunSetup_Draw(u8 cursor)\n'
              helper = '''static u32 RunSetup_CountEligibleFilterMons(void)\n{\n    u32 count = 0;\n    enum Species species;\n\n    for (species = SPECIES_BULBASAUR; species < NUM_SPECIES; species++)\n    {\n        bool32 typeOk = (GetSpeciesType(species, 0) == sRunSetupType || GetSpeciesType(species, 1) == sRunSetupType);\n        bool32 abilityOk = (GetSpeciesAbility(species, 0) == sRunSetupAbility\n                         || GetSpeciesAbility(species, 1) == sRunSetupAbility\n                         || GetSpeciesAbility(species, 2) == sRunSetupAbility);\n\n        if ((sRunSetupFilter == RUN_FILTER_TYPE && typeOk)\n         || (sRunSetupFilter == RUN_FILTER_ABILITY && abilityOk)\n         || (sRunSetupFilter == RUN_FILTER_TYPE_ABILITY && typeOk && abilityOk))\n            count++;\n    }\n    return count;\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('RunSetup_Draw anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          # Replace filter page drawing block and filter label setup.
          old = '''    const u8 *filter = sRunSetupFilter == RUN_FILTER_TYPE ? gTypesInfo[sRunSetupType].name : sText_RunSetupOff;\n'''
          new = '''    const u8 *filter = sRunSetupFilter == RUN_FILTER_TYPE ? gTypesInfo[sRunSetupType].name\n                     : sRunSetupFilter == RUN_FILTER_ABILITY ? gAbilitiesInfo[sRunSetupAbility].name\n                     : sRunSetupFilter == RUN_FILTER_TYPE_ABILITY ? sText_RunSetupBoth\n                     : sText_RunSetupOff;\n'''
          if old in text:
              text = text.replace(old, new, 1)

          start = text.find('    else if (sRunSetupPage == 1)\n    {\n', text.find('static void RunSetup_Draw'))
          end = text.find('    else\n    {\n', start)
          if start == -1 or end == -1:
              raise SystemExit('filter draw block not found')
          draw_block = '''    else if (sRunSetupPage == 1)\n    {\n        u32 eligible = RunSetup_CountEligibleFilterMons();\n        AddTextPrinterParameterized3(0, FONT_NORMAL, 8, 31, sTextColor_Headers, TEXT_SKIP_DRAW, sText_RunSetupFilter);\n        AddTextPrinterParameterized3(0, FONT_NORMAL, 8, 51, sTextColor_Headers, TEXT_SKIP_DRAW, sText_RunSetupType);\n        AddTextPrinterParameterized3(0, FONT_NORMAL, 8, 71, sTextColor_Headers, TEXT_SKIP_DRAW, sText_RunSetupAbility);\n        RunSetup_DrawChoice(sText_RunSetupOff, 83, 30, sRunSetupFilter == RUN_FILTER_NONE);\n        RunSetup_DrawChoice(sText_RunSetupTypeFilter, 136, 30, sRunSetupFilter == RUN_FILTER_TYPE);\n        RunSetup_DrawChoice(sText_RunSetupAbility, 189, 30, sRunSetupFilter == RUN_FILTER_ABILITY);\n        RunSetup_DrawChoice(gTypesInfo[sRunSetupType].name, 105, 50, cursor == 1);\n        RunSetup_DrawChoice(gAbilitiesInfo[sRunSetupAbility].name, 105, 70, cursor == 2);\n        if (sRunSetupFilter == RUN_FILTER_TYPE_ABILITY)\n            AddTextPrinterParameterized3(0, FONT_SMALL, 25, 91, sTextColor_Headers, TEXT_SKIP_DRAW, sText_RunSetupLimitedPool);\n        else if (eligible <= 5 && sRunSetupFilter != RUN_FILTER_NONE)\n            AddTextPrinterParameterized3(0, FONT_SMALL, 25, 91, sTextColor_Headers, TEXT_SKIP_DRAW, sText_RunSetupLimitedPool);\n        RunSetup_DrawChoice(sText_RunSetupBack, 52, 110, cursor == 3);\n        RunSetup_DrawChoice(sText_RunSetupConfirmButton, 108, 110, cursor == 4);\n        if (cursor < 3)\n            AddTextPrinterParameterized3(0, FONT_NORMAL, 2, 31 + 20 * cursor, sTextColor_Headers, TEXT_SKIP_DRAW, gText_SelectorArrow2);\n    }\n'''
          text = text[:start] + draw_block + text[end:]

          # Confirmation payload.
          text = text.replace('            gRunSetupFilterValue = sRunSetupType;\n', '''            gRunSetupFilterValue = sRunSetupFilter == RUN_FILTER_TYPE ? sRunSetupType\n                                 : sRunSetupFilter == RUN_FILTER_ABILITY ? sRunSetupAbility\n                                 : sRunSetupFilter == RUN_FILTER_TYPE_ABILITY ? (sRunSetupAbility << 5) | sRunSetupType\n                                 : 0;\n''', 1)

          # Replace filter-page input block.
          start = text.find('    if (sRunSetupPage == 1)\n    {\n', text.find('static void Task_RunSetup_Input'))
          end = text.find('    if (JOY_NEW(DPAD_UP))\n', start + 20)
          if start == -1 or end == -1:
              raise SystemExit('filter input block not found')
          input_block = '''    if (sRunSetupPage == 1)\n    {\n        u32 eligible;\n        if (JOY_NEW(DPAD_UP))\n            *cursor = (*cursor + 4) % 5;\n        else if (JOY_NEW(DPAD_DOWN))\n            *cursor = (*cursor + 1) % 5;\n        else if (JOY_NEW(DPAD_LEFT) && (*cursor == 3 || *cursor == 4))\n            *cursor = 3;\n        else if (JOY_NEW(DPAD_RIGHT) && (*cursor == 3 || *cursor == 4))\n            *cursor = 4;\n        else if ((JOY_NEW(DPAD_LEFT)) && *cursor == 0)\n            sRunSetupFilter = sRunSetupFilter == RUN_FILTER_NONE ? RUN_FILTER_TYPE_ABILITY : sRunSetupFilter - 1;\n        else if ((JOY_NEW(DPAD_RIGHT | A_BUTTON)) && *cursor == 0)\n        {\n            sRunSetupFilter = sRunSetupFilter == RUN_FILTER_TYPE_ABILITY ? RUN_FILTER_NONE : sRunSetupFilter + 1;\n            if (sRunSetupFilter != RUN_FILTER_NONE && sRunSetupRandomizer == RUN_WILD_NORMAL)\n                sRunSetupRandomizer = RUN_WILD_SCALED;\n        }\n        else if (JOY_NEW(DPAD_LEFT) && *cursor == 1)\n        {\n            sRunSetupType = sRunSetupType <= TYPE_NORMAL ? TYPE_FAIRY : sRunSetupType - 1;\n            if (sRunSetupType == TYPE_MYSTERY) sRunSetupType--;\n        }\n        else if (JOY_NEW(DPAD_RIGHT | A_BUTTON) && *cursor == 1)\n        {\n            sRunSetupType = sRunSetupType >= TYPE_FAIRY ? TYPE_NORMAL : sRunSetupType + 1;\n            if (sRunSetupType == TYPE_MYSTERY) sRunSetupType++;\n        }\n        else if (JOY_NEW(DPAD_LEFT) && *cursor == 2)\n            sRunSetupAbility = sRunSetupAbility <= 1 ? ABILITIES_COUNT - 1 : sRunSetupAbility - 1;\n        else if (JOY_NEW(DPAD_RIGHT | A_BUTTON) && *cursor == 2)\n            sRunSetupAbility = sRunSetupAbility >= ABILITIES_COUNT - 1 ? 1 : sRunSetupAbility + 1;\n        else if (JOY_NEW(B_BUTTON) || (JOY_NEW(A_BUTTON) && *cursor == 3))\n        {\n            sRunSetupPage = 0;\n            *cursor = 3;\n        }\n        else if (JOY_NEW(A_BUTTON) && *cursor == 4)\n        {\n            eligible = RunSetup_CountEligibleFilterMons();\n            if (sRunSetupFilter != RUN_FILTER_NONE && eligible == 0)\n            {\n                PlaySE(SE_BOO);\n                RunSetup_Draw(*cursor);\n                return;\n            }\n            sRunSetupConfirm = TRUE;\n            *cursor = 1;\n        }\n        else\n            return;\n\n        PlaySE(SE_SELECT);\n        RunSetup_Draw(*cursor);\n        return;\n    }\n\n'''
          text = text[:start] + input_block + text[end:]
          p.write_text(text)

          # Update extern type wherever present.
          for p in Path('src').rglob('*.c'):
              text = p.read_text(errors='ignore')
              if 'extern EWRAM_DATA u8 gRunSetupFilterValue;' in text:
                  p.write_text(text.replace('extern EWRAM_DATA u8 gRunSetupFilterValue;', 'extern EWRAM_DATA u16 gRunSetupFilterValue;'))

          # Wild encounter logic: ability = 0-1 normally, 20% chance of 2. Combined uses same tight pool.
          p = Path('src/wild_encounter.c')
          text = p.read_text()
          text = text.replace('    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n    {\n        // Restricted runs intentionally expose only one to three distinct\n        // species in each encounter method on a map.\n        u8 uniqueSlots = 1 + ((seed >> 8) % 3);\n\n        seedMonIndex %= uniqueSlots;\n    }\n', '''    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n    {\n        u8 uniqueSlots = 1 + ((seed >> 8) % 3);\n        seedMonIndex %= uniqueSlots;\n    }\n    else if (gSaveBlock3Ptr->filterMode == RUN_FILTER_ABILITY\n          || gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE_ABILITY)\n    {\n        // Ability pools are intentionally tiny: normally one species,\n        // occasionally two. Repeats across routes are expected.\n        u8 uniqueSlots = ((seed >> 13) % 5 == 0) ? 2 : 1;\n        seedMonIndex %= uniqueSlots;\n    }\n''', 1)
          text = text.replace('    if (gSaveBlock3Ptr->filterMode != RUN_FILTER_TYPE\n     && area == WILD_AREA_LAND && wildMonIndex >= 8)\n', '    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_NONE\n     && area == WILD_AREA_LAND && wildMonIndex >= 8)\n', 1)

          old = '''    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n    {\n        filterArgs.arg1 = gSaveBlock3Ptr->filterValue;\n        if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n        {\n            filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n            generator = SPECIES_GENERATOR_SCALED_TYPE_FILTERED;\n        }\n        else\n        {\n            generator = SPECIES_GENERATOR_TYPE_FILTERED;\n        }\n    }\n    else if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n'''
          new = '''    if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE\n     || gSaveBlock3Ptr->filterMode == RUN_FILTER_ABILITY\n     || gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE_ABILITY)\n    {\n        filterArgs.arg1 = gSaveBlock3Ptr->filterValue;\n        if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n            filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);\n\n        if (gSaveBlock3Ptr->filterMode == RUN_FILTER_TYPE)\n            generator = gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED ? SPECIES_GENERATOR_SCALED_TYPE_FILTERED : SPECIES_GENERATOR_TYPE_FILTERED;\n        else if (gSaveBlock3Ptr->filterMode == RUN_FILTER_ABILITY)\n            generator = gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED ? SPECIES_GENERATOR_SCALED_ABILITY_FILTERED : SPECIES_GENERATOR_ABILITY_FILTERED;\n        else\n            generator = gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED ? SPECIES_GENERATOR_SCALED_TYPE_ABILITY_FILTERED : SPECIES_GENERATOR_TYPE_ABILITY_FILTERED;\n    }\n    else if (gSaveBlock3Ptr->randomizerEnabled == RUN_WILD_SCALED)\n'''
          if old not in text:
              raise SystemExit('wild filter generator block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Self-delete workflow after source patch.
          Path('.github/workflows/apply-ability-filter.yml').unlink()

      - name: Commit ability filters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ability and combined run filters"
          git push origin HEAD:master
