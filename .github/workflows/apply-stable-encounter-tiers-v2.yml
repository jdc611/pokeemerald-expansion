name: Apply stable encounter tiers v2

"on":
  push:
    paths:
      - ".github/workflows/apply-stable-encounter-tiers-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch stable encounter tiers
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/wild_encounter.c')
          text = p.read_text()
          start = text.index('static u32 GetScaledWildTier(enum WildPokemonArea area, u8 wildMonIndex)')
          end = text.index('\nenum Species GetRandomizedWildSpecies', start)
          new = '''static u32 GetScaledWildTier(const struct WildPokemonInfo *wildMonInfo, enum WildPokemonArea area, u8 wildMonIndex, u8 seedMonIndex)\n{\n    // Keep a route's scaled pool stable for the whole run by deriving its tier\n    // from the encounter table itself, never from live badge/progression flags.\n    u32 nativeLevel = wildMonInfo->wildPokemon[seedMonIndex].maxLevel;\n    u32 tier;\n\n    if (nativeLevel <= 10)\n        tier = 0;\n    else if (nativeLevel <= 20)\n        tier = 1;\n    else if (nativeLevel <= 30)\n        tier = 2;\n    else if (nativeLevel <= 40)\n        tier = 3;\n    else\n        tier = 4;\n\n    // Rod progression already gates these encounters. Preserve the stronger\n    // pools for better rods even when fishing on an early-game map.\n    if (area == WILD_AREA_FISHING && wildMonIndex >= 5)\n        tier = 4; // Super Rod\n    else if (area == WILD_AREA_FISHING && wildMonIndex >= 2 && tier < 2)\n        tier = 2; // Good Rod\n\n    return tier;\n}\n'''
          text = text[:start] + new + text[end:]
          text = text.replace('filterArgs.arg2 = GetScaledWildTier(area, wildMonIndex);', 'filterArgs.arg2 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);')
          text = text.replace('filterArgs.arg1 = GetScaledWildTier(area, wildMonIndex);', 'filterArgs.arg1 = GetScaledWildTier(wildMonInfo, area, wildMonIndex, seedMonIndex);')
          p.write_text(text)
          Path('.github/workflows/apply-stable-encounter-tiers-v2.yml').unlink()
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wild_encounter.c .github/workflows/apply-stable-encounter-tiers-v2.yml
          git commit -m "Keep scaled encounters stable across progression"
          git push origin HEAD:master
