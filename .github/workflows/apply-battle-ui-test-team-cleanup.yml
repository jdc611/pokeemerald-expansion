name: Apply Battle UI + Test Team Cleanup

"on":
  push:
    paths:
      - ".github/workflows/apply-battle-ui-test-team-cleanup.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply Battle UI and test-team cleanup
        run: python3 .github/scripts/apply_battle_ui_test_team_cleanup.py
      - name: Commit implemented source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/battle_controller_player.c src/debug.c
          git commit -m "Battle UI + Test Team Cleanup"
          git push origin master
