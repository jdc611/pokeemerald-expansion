name: Build Playtest ROM

"on":
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/apply-*.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1
  PLAYTEST_TRIGGER: "Battle UI + Test Team Cleanup"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build Emerald
        env:
          GAME_VERSION: EMERALD
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "### Compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -nE '(^|: )(fatal error|error:|undefined reference|make(\[[0-9]+\])?: \*\*\*)' build.log | tail -80 | tee errors.txt || true
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error::$safe"
          done < errors.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      - name: Upload Playtest ROM
        uses: actions/upload-artifact@v4
        with:
          name: Battle-UI-Test-Team-Cleanup-${{ github.sha }}
          path: pokeemerald.gba
