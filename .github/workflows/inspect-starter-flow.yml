name: Inspect Starter Flow

on:
  push:
    paths:
      - ".github/workflows/inspect-starter-flow.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Find starter flow references
        run: |
          echo '=== GetStarterPokemon ==='
          grep -R -n -C 12 "GetStarterPokemon" src data include || true
          echo '=== CB2_ChooseStarter ==='
          grep -R -n -C 12 "CB2_ChooseStarter" src data include || true
          echo '=== ChooseStarter ==='
          grep -R -n -C 12 "ChooseStarter" src data include | head -300 || true
